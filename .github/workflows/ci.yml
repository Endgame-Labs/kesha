name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Rust components
        run: rustup component add rustfmt clippy

      - name: Rust format
        run: cargo fmt -- --check

      - name: Rust clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

      - name: golangci-lint example app
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: examples/go-app
          args: --config ../../.golangci.yml

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Rust toolchain
        run: rustup show

      - name: Go tests
        run: go test ./...

      - name: Rust tests
        run: cargo test --locked

      - name: Verify local shim
        if: runner.os != 'Windows'
        run: make verify

      - name: Verify example app
        if: runner.os != 'Windows'
        run: make example

      - name: Windows compile check
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go test -exec=true ./...
